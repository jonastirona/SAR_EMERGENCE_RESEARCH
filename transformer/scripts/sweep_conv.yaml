program: sweep_conv.py   # Make sure this matches your Python file's name
method: bayes
metric:
  name: test_emergence_rmse
  goal: minimize

# early_terminate:
#   type: hyperband
#   min_iter: 50

parameters:
  embed_dim:
    values: [64, 128, 256, 512]
  num_layers:
    values: [3, 4, 5, 6]
  num_heads:
    values: [4, 8, 16]
  ff_dim:
    values: [128, 256, 512, 1024]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  n_epochs:
    value: 300
  num_pred:
    value: 12
  num_in:
    value: 110
  time_window:
    value: 12
  rid_of_top:
    value: 4 